<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="app">
    <section class="panel panel--left">
      <h1>Bingo</h1>

      <div class="form">
        <label>
          Display Name
          <input id="player-name" maxlength="20" placeholder="Enter your name" />
        </label>
        <label>
          Room Code
          <input id="room-code" placeholder="Enter code (e.g. ABCD)" maxlength="6" />
        </label>
        <div class="actions">
          <button id="create-room">Create Room</button>
          <button id="join-room" class="secondary">Join Room</button>
        </div>
        <p id="status" class="status"></p>
      </div>

      <div class="panel__section">
        <h2>Game Settings</h2>
        <label>
          Board Size
          <select id="board-size" class="board-size-select">
            <option value="5">5 × 5 (Standard)</option>
            <option value="6">6 × 6 (Large)</option>
            <option value="10">10 × 10 (Epic)</option>
          </select>
        </label>
        <p class="hint">Only the host can change size while waiting.</p>
      </div>

      <div class="panel__section" id="room-info">
        <h2>Room Info</h2>
        <div class="info-grid">
          <p>Code: <strong id="info-code" style="color: var(--primary-color)">—</strong></p>
          <p>Status: <strong id="info-status">Not connected</strong></p>
          <p>Host: <strong id="info-host">—</strong></p>
          <p>Size: <strong id="info-board-size">5 × 5</strong></p>
        </div>
        <p id="turn-indicator" class="turn-indicator"></p>
      </div>

      <div class="panel__section">
        <h2>Leaderboard</h2>
        <ol id="winners" class="winners"></ol>
        <div id="loser-section" style="display: none; margin-top: 0.5rem;">
          <p id="loser-name" class="loser-name" style="color: var(--danger-color); font-weight: bold;"></p>
        </div>
      </div>

      <div class="panel__section">
        <h2>Players</h2>
        <ul id="players" class="player-list"></ul>
      </div>

      <div class="panel__section">
        <h2>Called Numbers</h2>
        <div id="called-numbers" class="number-grid"></div>
      </div>
    </section>

    <section class="panel panel--center">
      <div class="controls">
        <button id="start-game" disabled>Start Round</button>
        <button id="reset-after-game" class="secondary" disabled style="display: none;">Reset Game</button>
      </div>
      <div class="card-container">
        <div id="bingo-card" class="card"></div>
      </div>
    </section>

    <aside class="panel panel--chat" id="chat-panel" aria-label="Room chat">
      <header class="chat__header">
        <h2>Room Chat</h2>
        <button id="chat-close" class="chat__close" aria-label="Close chat" type="button">&times;</button>
      </header>
      <ul id="chat-messages" class="chat__messages" aria-live="polite">
        <li class="chat__empty">Join a room to start chatting.</li>
      </ul>
      <form id="chat-form" class="chat__form" autocomplete="off">
        <input id="chat-input" maxlength="300" placeholder="Join a room to chat" disabled aria-label="Chat message" />
        <button id="chat-send" type="submit" disabled aria-label="Send message">Send</button>
      </form>
    </aside>
  </main>

  <button id="chat-toggle" class="chat-toggle" type="button" aria-controls="chat-panel" aria-expanded="false" aria-label="Open chat">
    💬<span id="chat-badge" class="chat-toggle__badge" hidden>0</span>
  </button>
  <div id="chat-backdrop" class="chat-backdrop" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js" type="module"></script>
</body>

</html>
